[versions]
# Oldest Paper API that still has the plugin loader API used by PaperPluginLoader; compiling against it
# keeps accidental use of newer Bukkit/Paper methods out of the library.
paper = "1.21.4-R0.1-SNAPSHOT"
asm = "9.8"
jetbrains-annotations = "26.1.0"
junit = "6.1.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
